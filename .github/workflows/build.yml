name: CI - Multi Compose Builder

on:
  workflow_dispatch:
    inputs:
      compose_file:
        description: 'Choose docker-compose file'
        required: true
        default: 'docker-compose.yml'
        type: choice
        options:
          - docker-compose.yml
          - docker-compose-partitions.yml
          - dockercompose.kafka.yml

  push:
    branches: [main, master, patch-1]
  pull_request:
    branches: [main, master, patch-1]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Maven Central Mirror
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <profiles>
              <profile>
                <id>central</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>central</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Fix malformed pom.xml headers
        run: |
          find . -name "pom.xml" -exec sed -i '1s/^[^<]*//' {} \;

      - name: Force remove SNAPSHOT of springfox-swagger2
        run: |
          mvn dependency:purge-local-repository \
            -DmanualInclude="io.springfox:springfox-swagger2"

      - name: Build Spring Boot apps
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build & Run Docker Compose
        run: |
          COMPOSE_FILE="${{ github.event.inputs.compose_file }}"
          if [ -z "$COMPOSE_FILE" ]; then
            COMPOSE_FILE="docker-compose.yml"
          fi
          docker-compose -f "$COMPOSE_FILE" up --build -d
